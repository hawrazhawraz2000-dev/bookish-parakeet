<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PANOPTICON v2.4</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.21.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root { --g:#39ff14; --g2:rgba(57,255,20,0.5); --g3:rgba(57,255,20,0.2); --g4:rgba(57,255,20,0.08); --bg:#0a1628; --bg2:rgba(8,18,35,0.92); }
html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:'Share Tech Mono',monospace; user-select:none; }
#app { position:relative; width:100vw; height:100vh; overflow:hidden; }

#video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.85; z-index:1; }
#overlay { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:2; pointer-events:none; }
#grid { position:absolute; inset:0; z-index:3; pointer-events:none; background-image:linear-gradient(rgba(57,255,20,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(57,255,20,0.04) 1px,transparent 1px); background-size:48px 48px; }
#scanlines { position:absolute; inset:0; z-index:4; pointer-events:none; background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.1) 2px,rgba(0,0,0,0.1) 4px); }
#vignette { position:absolute; inset:0; z-index:5; pointer-events:none; box-shadow:inset 0 0 180px rgba(0,5,20,0.9); }

/* HUD */
#hud-top { position:absolute; top:0; left:0; right:0; z-index:20; display:flex; justify-content:space-between; align-items:flex-start; padding:10px 14px 8px; border-bottom:1px solid rgba(57,255,20,0.12); pointer-events:none; }
#hud-title { font-size:13px; font-weight:bold; letter-spacing:0.3em; text-transform:uppercase; color:var(--g); }
#hud-sub { font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(57,255,20,0.35); padding-left:22px; }
#hud-metrics { display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
.metric-row { display:flex; align-items:center; gap:8px; }
.metric-label { font-size:9px; letter-spacing:0.15em; color:rgba(57,255,20,0.4); }
.metric-val { font-size:9px; font-weight:bold; color:var(--g); min-width:50px; text-align:right; }

/* Crosshair */
#crosshair { position:absolute; inset:0; z-index:10; pointer-events:none; display:flex; align-items:center; justify-content:center; }
.ch-h { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:40px; height:1px; background:var(--g2); }
.ch-v { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:1px; height:40px; background:var(--g2); }
#ch-ring { position:absolute; width:60px; height:60px; border:1px dashed rgba(57,255,20,0.2); border-radius:50%; animation:spin 8s linear infinite; display:none; }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

/* ── Floating target windows ── */
.float-win {
  position:absolute; z-index:30;
  width:155px;
  background:rgba(8,18,35,0.88);
  border:1px solid rgba(57,255,20,0.35);
  display:flex; flex-direction:column;
  transition:border-color 0.4s, box-shadow 0.4s;
}
.float-win.new-t { border-color:rgba(57,255,20,0.8); box-shadow:0 0 12px rgba(57,255,20,0.2); }
.float-win-hd {
  display:flex; align-items:center; justify-content:space-between;
  padding:3px 7px; flex-shrink:0;
  border-bottom:1px solid rgba(57,255,20,0.18);
  background:rgba(57,255,20,0.06);
  transition:background 0.4s;
}
.float-win.new-t .float-win-hd { background:rgba(57,255,20,0.15); border-bottom-color:rgba(57,255,20,0.5); }
.float-win-id { font-size:9px; font-weight:bold; letter-spacing:0.08em; color:var(--g); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.float-win.new-t .float-win-id { animation:pulse 0.7s ease-in-out 2; }
.float-win-score { font-size:8px; color:rgba(57,255,20,0.6); flex-shrink:0; margin-left:4px; }
.float-win-canvas-wrap { position:relative; height:102px; overflow:hidden; flex-shrink:0; }
.float-win-canvas { display:block; width:100%; height:100%; }
.float-win-flash { position:absolute; inset:0; pointer-events:none; background:rgba(57,255,20,0.06); animation:pulse 0.7s ease-in-out 2; }
.fcorner { position:absolute; width:8px; height:8px; border-color:rgba(57,255,20,0.55); border-style:solid; }
.fc-tl { top:0; left:0; border-width:1px 0 0 1px; }
.fc-tr { top:0; right:0; border-width:1px 1px 0 0; }
.fc-bl { bottom:0; left:0; border-width:0 0 1px 1px; }
.fc-br { bottom:0; right:0; border-width:0 1px 1px 0; }
.float-win-ft {
  display:flex; justify-content:space-between; align-items:center;
  padding:2px 7px;
  border-top:1px solid rgba(57,255,20,0.1);
  background:rgba(57,255,20,0.03);
}
.float-win-ft-k { font-size:7px; text-transform:uppercase; color:rgba(57,255,20,0.35); }
.float-win-ft-v { font-size:7px; font-weight:bold; color:rgba(57,255,20,0.65); }

/* ── Compact corner badge ── */
#badge {
  position:absolute; bottom:60px; right:0; z-index:40;
  width:110px;
  background:rgba(8,18,35,0.88);
  border:1px solid rgba(57,255,20,0.25);
}
.badge-corner { position:absolute; width:10px; height:10px; border-color:var(--g); border-style:solid; }
.bc-tl { top:-1px; left:-1px; border-width:2px 0 0 2px; }
.bc-tr { top:-1px; right:-1px; border-width:2px 2px 0 0; }
.bc-bl { bottom:-1px; left:-1px; border-width:0 0 2px 2px; }
.bc-br { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }
.badge-header { padding:4px 8px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(57,255,20,0.15); }
.badge-title { font-size:8px; font-weight:bold; letter-spacing:0.2em; text-transform:uppercase; color:var(--g); }
.badge-count { font-size:9px; font-weight:bold; padding:0 4px; background:var(--g); color:var(--bg); }
.badge-fps { padding:3px 8px; display:flex; align-items:center; justify-content:space-between; }
.badge-fps-k { font-size:7px; text-transform:uppercase; color:rgba(57,255,20,0.4); }
.badge-fps-v { font-size:8px; font-weight:bold; color:var(--g); }
.badge-item { padding:2px 8px; display:flex; align-items:center; justify-content:space-between; border-top:1px solid rgba(57,255,20,0.06); }
.badge-item-id { font-size:7px; color:rgba(57,255,20,0.6); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.badge-item-pct { font-size:7px; color:rgba(57,255,20,0.4); flex-shrink:0; margin-left:4px; }
.badge-more { padding:2px 8px; text-align:center; border-top:1px solid rgba(57,255,20,0.06); font-size:7px; color:rgba(57,255,20,0.3); }

/* Camera error */
#cam-error { position:absolute; top:62px; left:50%; transform:translateX(-50%); z-index:25; display:none; align-items:center; gap:10px; padding:6px 14px; white-space:nowrap; border:1px solid rgba(255,200,0,0.5); background:rgba(10,22,40,0.9); }
#cam-error span { font-size:9px; letter-spacing:0.15em; text-transform:uppercase; color:#ffc800; }

/* Controls */
#controls { position:absolute; bottom:0; left:0; right:0; z-index:20; padding:8px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; background:rgba(8,18,35,0.95); border-top:1px solid var(--g3); height:52px; }
.ctrl-btns { display:flex; gap:8px; align-items:center; }
.btn { display:flex; align-items:center; gap:6px; padding:0 14px; height:34px; font-family:'Share Tech Mono',monospace; font-size:9px; font-weight:bold; letter-spacing:0.2em; text-transform:uppercase; cursor:pointer; border:1px solid; background:transparent; transition:all 0.15s; }
#btn-engage { border-color:var(--g); color:var(--g); background:var(--g4); }
#btn-engage:hover { background:rgba(57,255,20,0.15); }
#btn-engage:disabled { opacity:0.3; cursor:not-allowed; }
#btn-halt { border-color:rgba(57,255,20,0.6); color:var(--g); display:none; }
#btn-halt:hover { background:rgba(57,255,20,0.1); }
#btn-dump { border-color:rgba(57,255,20,0.4); color:rgba(57,255,20,0.7); }
#btn-dump:hover { background:rgba(57,255,20,0.07); }
#btn-dump:disabled { opacity:0.3; cursor:not-allowed; }
.slider-wrap { display:flex; flex-direction:column; gap:3px; width:200px; flex-shrink:0; }
.slider-labels { display:flex; justify-content:space-between; font-size:8px; letter-spacing:0.1em; text-transform:uppercase; }
.slider-top { color:rgba(57,255,20,0.4); }
.slider-top span { color:var(--g); }
.slider-bottom { color:rgba(57,255,20,0.2); }
input[type=range] { -webkit-appearance:none; width:100%; height:2px; background:rgba(57,255,20,0.15); outline:none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:10px; height:10px; background:var(--g); border-radius:0; cursor:pointer; }
input[type=range]::-moz-range-thumb { width:10px; height:10px; background:var(--g); border-radius:0; border:none; cursor:pointer; }

/* Loading */
#loading { position:absolute; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:rgba(10,22,40,0.95); }
#loading-icon { font-size:32px; color:var(--g); animation:pulse 1s ease-in-out infinite; }
#loading-text { font-size:16px; font-weight:bold; letter-spacing:0.3em; text-transform:uppercase; color:var(--g); animation:pulse 1s ease-in-out infinite; }
#loading-bar-wrap { width:220px; height:2px; background:rgba(57,255,20,0.15); overflow:hidden; }
#loading-bar { height:100%; background:var(--g); animation:lbar 2s ease-in-out infinite; }
#loading-sub { font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(57,255,20,0.35); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
@keyframes lbar { 0%{width:0%;margin-left:0%} 50%{width:70%;margin-left:15%} 100%{width:0%;margin-left:100%} }
</style>
</head>
<body>
<div id="app">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="grid"></div>
  <div id="scanlines"></div>
  <div id="vignette"></div>

  <!-- Top HUD -->
  <div id="hud-top">
    <div>
      <div style="display:flex;align-items:center;gap:8px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#39ff14" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9" stroke-dasharray="4 2"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
        <span id="hud-title">Panopticon v2.4</span>
      </div>
      <div id="hud-sub">COCO-SSD MobileNet v2 // Real-time</div>
    </div>
    <div id="hud-metrics">
      <div class="metric-row"><span class="metric-label">MEMORY:</span><span class="metric-val" id="m-mem">— MB</span></div>
      <div class="metric-row"><span class="metric-label">CPU_LOAD:</span><span class="metric-val" id="m-cpu">—%</span></div>
      <div class="metric-row"><span class="metric-label">LATENCY:</span><span class="metric-val" id="m-lat">—ms</span></div>
      <div class="metric-row"><span class="metric-label">RESOLUTION:</span><span class="metric-val" id="m-res">—</span></div>
    </div>
  </div>

  <!-- Camera error -->
  <div id="cam-error">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffc800" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><path d="M21 21H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3m3-3h6l2 3h4a2 2 0 0 1 2 2v9.34"/></svg>
    <span>Camera unavailable — allow access and refresh</span>
  </div>

  <!-- Crosshair -->
  <div id="crosshair">
    <div class="ch-h"></div><div class="ch-v"></div>
    <div id="ch-ring"></div>
  </div>

  <!-- Compact corner badge (bottom-right) -->
  <div id="badge">
    <div class="badge-corner bc-tl"></div><div class="badge-corner bc-tr"></div>
    <div class="badge-corner bc-bl"></div><div class="badge-corner bc-br"></div>
    <div class="badge-header">
      <span class="badge-title">Tracked</span>
      <span class="badge-count" id="badge-count">0</span>
    </div>
    <div class="badge-fps">
      <span class="badge-fps-k">FPS</span>
      <span class="badge-fps-v" id="fps-val">0</span>
    </div>
    <div id="badge-list"></div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <div class="ctrl-btns">
      <button class="btn" id="btn-engage" disabled>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        Engage Sensors
      </button>
      <button class="btn" id="btn-halt">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18"/></svg>
        Halt Sensors
      </button>
      <button class="btn" id="btn-dump" disabled>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Data Dump
      </button>
    </div>
    <div class="slider-wrap">
      <div class="slider-labels slider-top"><span>Confidence Threshold</span><span id="thresh-val">50%</span></div>
      <input type="range" id="threshold-slider" min="0" max="100" value="50">
      <div class="slider-labels slider-bottom"><span>Noise</span><span>Strict</span></div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div id="loading-icon">⊕</div>
    <div id="loading-text">Initializing Neural Net...</div>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    <div id="loading-sub">Loading COCO-SSD Model</div>
  </div>
</div>

<script>
const GREEN = '#39ff14';
const PAD = 28;
const WIN_W = 155;

let model=null, stream=null, animFrame=null;
let isTracking=false, threshold=0.5;
let prevTracked=new Map(), prevIds=new Set(), newTargetTimers=new Map();
let frameCount=0, fpsLastTime=performance.now(), fps=0;

const video      = document.getElementById('video');
const overlay    = document.getElementById('overlay');
const loading    = document.getElementById('loading');
const camError   = document.getElementById('cam-error');
const btnEngage  = document.getElementById('btn-engage');
const btnHalt    = document.getElementById('btn-halt');
const btnDump    = document.getElementById('btn-dump');
const slider     = document.getElementById('threshold-slider');
const threshVal  = document.getElementById('thresh-val');
const chRing     = document.getElementById('ch-ring');
const badgeCount = document.getElementById('badge-count');
const fpsVal     = document.getElementById('fps-val');
const badgeList  = document.getElementById('badge-list');
const mMem       = document.getElementById('m-mem');
const mCpu       = document.getElementById('m-cpu');
const mLat       = document.getElementById('m-lat');
const mRes       = document.getElementById('m-res');
const overlayCtx = overlay.getContext('2d');
const appEl      = document.getElementById('app');

// ── Load model ─────────────────────────────────────────────────
async function init() {
  try {
    try { await tf.setBackend('webgl'); await tf.ready(); }
    catch(_) { await tf.setBackend('cpu'); await tf.ready(); }
    model = await cocoSsd.load({ base:'lite_mobilenet_v2' });
    loading.style.display = 'none';
    btnEngage.disabled = false; btnDump.disabled = false;
    startMetrics();
  } catch(e) {
    document.getElementById('loading-text').textContent = 'Neural Core Failure';
    document.getElementById('loading-sub').textContent = e.message||'Failed to load model';
    document.getElementById('loading-bar-wrap').style.display = 'none';
  }
}

// ── Camera ─────────────────────────────────────────────────────
async function startCamera() {
  const tries=[{video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}},{video:{width:{ideal:1280},height:{ideal:720}}},{video:true}];
  for(const c of tries) {
    try {
      stream = await navigator.mediaDevices.getUserMedia(c);
      video.srcObject = stream;
      await new Promise(r=>{video.onloadedmetadata=r;});
      await video.play();
      mRes.textContent = `${video.videoWidth}x${video.videoHeight}`;
      return true;
    } catch(_) {}
  }
  camError.style.display = 'flex'; return false;
}

// ── Tracking ───────────────────────────────────────────────────
function matchByDistance(dets) {
  const next=new Map(), used=new Set();
  for(const det of dets) {
    const [x,y,w,h]=det.bbox, cx=x+w/2, cy=y+h/2;
    let bestId=null, bestDist=Infinity;
    for(const [id,obj] of prevTracked) {
      if(obj.class!==det.class||used.has(id)) continue;
      const dx=obj.center[0]-cx, dy=obj.center[1]-cy, d=Math.sqrt(dx*dx+dy*dy);
      if(d<bestDist){bestDist=d;bestId=id;}
    }
    let id, velocity;
    if(bestId&&bestDist<120) {
      id=bestId; const p=prevTracked.get(bestId);
      const rvx=(cx-p.center[0])*0.4, rvy=(cy-p.center[1])*0.4;
      velocity=[p.velocity[0]*0.6+rvx*0.4, p.velocity[1]*0.6+rvy*0.4];
      used.add(id);
    } else {
      let maxNum=0;
      for(const [pid] of prevTracked){const parts=pid.split('_'),cls=parts.slice(0,-1).join('_').toLowerCase();if(cls===det.class.toLowerCase()){const n=parseInt(parts[parts.length-1],10);if(!isNaN(n)&&n>maxNum)maxNum=n;}}
      for(const [,o] of next){if(o.class.toLowerCase()===det.class.toLowerCase())maxNum++;}
      id=`${det.class.toUpperCase()}_${String(maxNum+1).padStart(3,'0')}`; velocity=[0,0];
    }
    next.set(id,{id,class:det.class,bbox:det.bbox,score:det.score,center:[cx,cy],velocity});
  }
  return next;
}

// ── Draw main overlay ──────────────────────────────────────────
function drawTracked(objects) {
  overlayCtx.clearRect(0,0,overlay.width,overlay.height);
  for(const obj of objects) {
    const [x,y,w,h]=obj.bbox;
    overlayCtx.fillStyle='rgba(57,255,20,0.12)'; overlayCtx.fillRect(x,y,w,h);
    overlayCtx.strokeStyle=GREEN; overlayCtx.lineWidth=1.5; overlayCtx.strokeRect(x,y,w,h);
    const len=14; overlayCtx.lineWidth=2.5; overlayCtx.beginPath();
    overlayCtx.moveTo(x,y+len);overlayCtx.lineTo(x,y);overlayCtx.lineTo(x+len,y);
    overlayCtx.moveTo(x+w-len,y);overlayCtx.lineTo(x+w,y);overlayCtx.lineTo(x+w,y+len);
    overlayCtx.moveTo(x+w,y+h-len);overlayCtx.lineTo(x+w,y+h);overlayCtx.lineTo(x+w-len,y+h);
    overlayCtx.moveTo(x,y+h-len);overlayCtx.lineTo(x,y+h);overlayCtx.lineTo(x+len,y+h);
    overlayCtx.stroke(); overlayCtx.lineWidth=1.5;
    overlayCtx.font='bold 12px "Share Tech Mono",monospace'; overlayCtx.fillStyle=GREEN;
    overlayCtx.fillText(obj.id,x,y-6);
    overlayCtx.font='11px "Share Tech Mono",monospace';
    overlayCtx.fillText(`${(obj.score*100).toFixed(0)}%`,x,y+h+14);
    const [vx,vy]=obj.velocity, speed=Math.sqrt(vx*vx+vy*vy), bcx=x+w/2, bcy=y+h/2;
    overlayCtx.strokeStyle=GREEN; overlayCtx.lineWidth=1.5;
    if(speed>0.3){const sc=Math.min(speed*8,Math.min(w,h)*0.35),nx=vx/speed,ny=vy/speed,ex=bcx+nx*sc,ey=bcy+ny*sc;overlayCtx.beginPath();overlayCtx.moveTo(bcx,bcy);overlayCtx.lineTo(ex,ey);overlayCtx.stroke();const ang=Math.atan2(ny,nx),a=6;overlayCtx.beginPath();overlayCtx.moveTo(ex,ey);overlayCtx.lineTo(ex-a*Math.cos(ang-0.4),ey-a*Math.sin(ang-0.4));overlayCtx.moveTo(ex,ey);overlayCtx.lineTo(ex-a*Math.cos(ang+0.4),ey-a*Math.sin(ang+0.4));overlayCtx.stroke();}
    else{overlayCtx.lineWidth=1;overlayCtx.beginPath();overlayCtx.moveTo(bcx-5,bcy);overlayCtx.lineTo(bcx+5,bcy);overlayCtx.moveTo(bcx,bcy-5);overlayCtx.lineTo(bcx,bcy+5);overlayCtx.stroke();}
  }
}

// ── Draw mini-window canvas ────────────────────────────────────
function drawMiniCanvas(canvas, obj) {
  if(!canvas||video.readyState<4) return;
  const [bx,by,bw,bh]=obj.bbox, vw=video.videoWidth, vh=video.videoHeight;
  const sx=Math.max(0,bx-PAD), sy=Math.max(0,by-PAD);
  const sw=Math.min(vw-sx,bw+PAD*2), sh=Math.min(vh-sy,bh+PAD*2);
  canvas.width=sw; canvas.height=sh;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,sx,sy,sw,sh,0,0,sw,sh);
  ctx.fillStyle='rgba(57,255,20,0.05)'; ctx.fillRect(0,0,sw,sh);
  ctx.fillStyle='rgba(0,0,0,0.18)'; for(let yy=0;yy<sh;yy+=4) ctx.fillRect(0,yy,sw,2);
  const rx=bx-sx, ry=by-sy;
  ctx.strokeStyle=GREEN; ctx.lineWidth=1.5; ctx.strokeRect(rx,ry,bw,bh);
  const len=8; ctx.lineWidth=2; ctx.beginPath();
  ctx.moveTo(rx,ry+len);ctx.lineTo(rx,ry);ctx.lineTo(rx+len,ry);
  ctx.moveTo(rx+bw-len,ry);ctx.lineTo(rx+bw,ry);ctx.lineTo(rx+bw,ry+len);
  ctx.moveTo(rx+bw,ry+bh-len);ctx.lineTo(rx+bw,ry+bh);ctx.lineTo(rx+bw-len,ry+bh);
  ctx.moveTo(rx,ry+bh-len);ctx.lineTo(rx,ry+bh);ctx.lineTo(rx+len,ry+bh);
  ctx.stroke();
  const cx2=rx+bw/2, cy2=ry+bh/2;
  ctx.fillStyle=GREEN; ctx.fillRect(cx2-1,cy2-4,2,8); ctx.fillRect(cx2-4,cy2-1,8,2);
  const [vx,vy]=obj.velocity, speed=Math.sqrt(vx*vx+vy*vy);
  if(speed>0.3){const sc=Math.min(speed*7,Math.min(bw,bh)*0.3),nx=vx/speed,ny=vy/speed,ex=cx2+nx*sc,ey=cy2+ny*sc;ctx.strokeStyle=GREEN;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx2,cy2);ctx.lineTo(ex,ey);ctx.stroke();const ang=Math.atan2(ny,nx),a=5;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-a*Math.cos(ang-0.4),ey-a*Math.sin(ang-0.4));ctx.moveTo(ex,ey);ctx.lineTo(ex-a*Math.cos(ang+0.4),ey-a*Math.sin(ang+0.4));ctx.stroke();}
}

// ── Calculate floating window screen position ──────────────────
function calcWinPos(obj) {
  const sw=window.innerWidth, sh=window.innerHeight;
  const vw=video.videoWidth||1280, vh=video.videoHeight||720;
  const scale=Math.max(sw/vw, sh/vh);
  const offX=(sw-vw*scale)/2, offY=(sh-vh*scale)/2;
  const [bx,by,bw,bh]=obj.bbox;
  const sbx=bx*scale+offX, sby=by*scale+offY;
  const sbr=(bx+bw)*scale+offX, sbb=(by+bh)*scale+offY;
  let left=sbr+8, top=sby;
  if(left+WIN_W>sw-10){ left=sbx-WIN_W-8; }
  if(left<4){ left=sbr+4; }
  if(left+WIN_W>sw-10){ left=Math.max(4,sw-WIN_W-4); }
  if(top+120>sh-56){ top=sbb-120; }
  if(top<56){ top=56; }
  return {left:Math.round(left), top:Math.round(top)};
}

// ── Floating windows update ─────────────────────────────────────
function fmtVel(v){return `${v[0]>=0?'+':''}${v[0].toFixed(1)},${v[1]>=0?'+':''}${v[1].toFixed(1)}`;}

function updateFloatWindows(objects) {
  const currentIds=new Set(objects.map(o=>o.id));
  const newIds=[...currentIds].filter(id=>!prevIds.has(id));
  newIds.forEach(id=>{
    if(newTargetTimers.has(id)) clearTimeout(newTargetTimers.get(id));
    const t=setTimeout(()=>{ const el=document.querySelector(`.float-win[data-id="${id}"]`); if(el){el.classList.remove('new-t');} newTargetTimers.delete(id); },1500);
    newTargetTimers.set(id,t);
  });
  prevIds=currentIds;

  // Remove stale windows
  document.querySelectorAll('.float-win').forEach(el=>{if(!objects.find(o=>o.id===el.dataset.id)) el.remove();});

  // Add/update windows
  for(const obj of objects) {
    let win=document.querySelector(`.float-win[data-id="${obj.id}"]`);
    if(!win){
      win=document.createElement('div');
      win.className='float-win'; win.dataset.id=obj.id;
      win.innerHTML=`
        <div class="float-win-hd">
          <span class="float-win-id">${obj.id}</span>
          <span class="float-win-score"></span>
        </div>
        <div class="float-win-canvas-wrap">
          <canvas class="float-win-canvas"></canvas>
          <div class="fcorner fc-tl"></div><div class="fcorner fc-tr"></div>
          <div class="fcorner fc-bl"></div><div class="fcorner fc-br"></div>
        </div>
        <div class="float-win-ft">
          <span class="float-win-ft-k">VEL</span>
          <span class="float-win-ft-v"></span>
        </div>`;
      appEl.appendChild(win);
    }
    if(newIds.includes(obj.id)) win.classList.add('new-t');
    const pos=calcWinPos(obj);
    win.style.left=pos.left+'px'; win.style.top=pos.top+'px';
    win.querySelector('.float-win-score').textContent=`${(obj.score*100).toFixed(0)}%`;
    win.querySelector('.float-win-ft-v').textContent=fmtVel(obj.velocity);
    drawMiniCanvas(win.querySelector('.float-win-canvas'),obj);
  }
}

// ── Badge update ───────────────────────────────────────────────
function updateBadge(objects) {
  badgeCount.textContent=objects.length; fpsVal.textContent=fps;
  const shown=objects.slice(0,4);
  badgeList.innerHTML=shown.map(o=>`<div class="badge-item"><span class="badge-item-id">${o.id}</span><span class="badge-item-pct">${(o.score*100).toFixed(0)}%</span></div>`).join('');
  if(objects.length>4) badgeList.innerHTML+=`<div class="badge-more">+${objects.length-4} more</div>`;
}

// ── Detection loop ──────────────────────────────────────────────
async function detectLoop() {
  if(!isTracking||!model) return;
  if(video.readyState===4&&video.videoWidth>0) {
    if(overlay.width!==video.videoWidth||overlay.height!==video.videoHeight){overlay.width=video.videoWidth;overlay.height=video.videoHeight;}
    const t0=performance.now();
    try {
      const preds=await model.detect(video);
      mLat.textContent=`${Math.round(performance.now()-t0)}ms`;
      const filtered=preds.filter(p=>p.score>=threshold);
      const nextTracked=matchByDistance(filtered);
      prevTracked=nextTracked;
      const objects=[...nextTracked.values()];
      drawTracked(objects);
      updateFloatWindows(objects);
      updateBadge(objects);
      frameCount++; const now=performance.now();
      if(now-fpsLastTime>=1000){fps=Math.round(frameCount*1000/(now-fpsLastTime));frameCount=0;fpsLastTime=now;fpsVal.textContent=fps;}
    } catch(_) {}
  }
  if(isTracking) animFrame=requestAnimationFrame(detectLoop);
}

// ── Metrics ────────────────────────────────────────────────────
function startMetrics() {
  setInterval(()=>{
    if(performance.memory) mMem.textContent=`${Math.round(performance.memory.usedJSHeapSize/1024/1024)} MB`;
    mCpu.textContent=`${Math.min(Math.round(20+fps*1.5+Math.random()*5),99).toFixed(1)}%`;
  },1500);
}

// ── Controls ───────────────────────────────────────────────────
btnEngage.addEventListener('click', async()=>{
  const ok=await startCamera(); if(!ok) return;
  isTracking=true; prevTracked=new Map(); prevIds=new Set();
  frameCount=0; fpsLastTime=performance.now();
  btnEngage.style.display='none'; btnHalt.style.display='flex'; chRing.style.display='block';
  detectLoop();
});

btnHalt.addEventListener('click',()=>{
  isTracking=false;
  if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  video.srcObject=null;
  overlayCtx.clearRect(0,0,overlay.width,overlay.height);
  prevTracked=new Map(); prevIds=new Set();
  document.querySelectorAll('.float-win').forEach(e=>e.remove());
  badgeCount.textContent='0'; fpsVal.textContent='0'; badgeList.innerHTML='';
  btnHalt.style.display='none'; btnEngage.style.display='flex'; chRing.style.display='none';
  mLat.textContent='—ms';
});

btnDump.addEventListener('click',()=>{
  const snap=document.createElement('canvas');
  snap.width=overlay.width||1280; snap.height=overlay.height||720;
  const ctx=snap.getContext('2d');
  ctx.drawImage(video,0,0,snap.width,snap.height);
  ctx.drawImage(overlay,0,0,snap.width,snap.height);
  ctx.fillStyle='rgba(10,20,10,0.7)'; ctx.fillRect(10,10,260,36);
  ctx.fillStyle=GREEN; ctx.font='bold 13px "Share Tech Mono",monospace';
  ctx.fillText(`PANOPTICON [${prevTracked.size} TRACKED]`,18,33);
  const a=document.createElement('a');
  a.download=`PANOPTICON_${Date.now()}.png`; a.href=snap.toDataURL('image/png'); a.click();
});

slider.addEventListener('input',()=>{threshold=slider.value/100;threshVal.textContent=`${slider.value}%`;});
init();
</script>
